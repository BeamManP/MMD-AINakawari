; AIナカワリ（MMM 版・配布の zip の形）。相対の場所は、この ini のフォルダ（MMM の Plugins）から読む。
; Python などは MMM のフォルダの MMD-AINakawari\ に置く（MMD 版と同じ物）
; python: 窓を動かす Python（pythonw.exe は黒い窓を出さない）
; home:   AIナカワリ のフォルダ（mmd_ainakawari の入っている所）
[MMM-AINakawari]
python=..\MMD-AINakawari\python\pythonw.exe
home=..\MMD-AINakawari\app
