; AIナカワリ（配布の zip の形）。相対の場所は、この ini のフォルダ（plugin\MMD-AINakawari）から読む。
; Python などは MMD のフォルダの MMD-AINakawari\ に置く。plugin\ の下に置くと、MMDPlugin が中の DLL を全部読み込もうとして MMD が落ちる
; python: 窓を動かす Python（pythonw.exe は黒い窓を出さない）
; home:   AIナカワリ のフォルダ（mmd_ainakawari の入っている所）
; debug=1 にすると、横に MMD-AINakawari.log を書く
[MMD-AINakawari]
python=..\..\MMD-AINakawari\python\pythonw.exe
home=..\..\MMD-AINakawari\app
